name: Deploy GCP Cloud Services

on:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
      - '.github/workflows/deploy-services.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'services/**'

jobs:
  validate-and-deploy-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lint & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r services/data-scraper/requirements.txt -r services/inference-engine/requirements.txt

      - name: Lint Python Code
        run: |
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Function (Data Scraper)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gcloud functions deploy transit-demand-scraper \
            --gen2 \
            --runtime=python311 \
            --region=us-central1 \
            --source=services/data-scraper \
            --entry-point=ingest_transit_demand_metrics \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
